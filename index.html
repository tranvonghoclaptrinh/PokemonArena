<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Area Battle - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/index.css">
</head>
<body onclick="initAudio()">

    <div class="bg-overlay"></div>

    <div class="login-card">
        <h1 class="text-xl mb-2 text-yellow-400" style="text-shadow: 2px 2px #3b4cca;">POKÉMON</h1>
        <h2 class="text-lg mb-8 text-white">AREA BATTLE</h2>
        
        <div id="loginSection" class="form-container form-active">
            <form id="loginForm">
                <div class="text-left mb-2 text-[10px] text-gray-400 uppercase tracking-tighter">Account ID:</div>
                <input type="text" id="loginUser" class="input-field" placeholder="Enter account..." required>

                <div class="text-left mb-2 text-[10px] text-gray-400 uppercase tracking-tighter">Password:</div>
                <div class="password-container">
                    <input type="password" id="loginPass" class="input-field" placeholder="••••••••" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('loginPass')">👁️</span>
                </div>

                <button type="submit" class="btn-primary">START BATTLE!</button>
            </form>
            <div class="btn-secondary" onclick="toggleForm('register')">New Trainer? Register here</div>
        </div>

        <div id="registerSection" class="form-container">
            <form id="registerForm">
                <div class="text-left mb-1 text-[10px] text-gray-400 uppercase tracking-tighter">Trainer Name:</div>
                <input type="text" id="regTrainerName" class="input-field" placeholder="Display name in game" required>

                <div class="text-left mb-1 text-[10px] text-gray-400 uppercase tracking-tighter">Account ID:</div>
                <input type="text" id="regUser" class="input-field" placeholder="Alphanumeric (e.g. Ash123)" required>
                
                <div class="text-left mt-2 mb-1 text-[10px] text-gray-400 uppercase tracking-tighter">New Password:</div>
                <div class="password-container">
                    <input type="password" id="regPass" class="input-field" placeholder="••••••••" required oninput="checkStrength(this.value)">
                    <span class="toggle-password" onclick="togglePasswordVisibility('regPass')">👁️</span>
                </div>
                
                <div class="strength-meter">
                    <div id="strengthBar" class="strength-bar"></div>
                </div>
                <div id="strengthLabel" class="strength-label" style="color: #4a5568;">Strength: -</div>

                <div class="info-note">
                    <strong>Security Tips:</strong>
                    • Min 6 chars (A-z, 0-9, !@#)
                </div>

                <div class="text-left mt-4 mb-1 text-[10px] text-gray-400 uppercase tracking-tighter">Confirm Password:</div>
                <div class="password-container">
                    <input type="password" id="regPassConfirm" class="input-field" placeholder="••••••••" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('regPassConfirm')">👁️</span>
                </div>

                <button type="submit" class="btn-primary" style="background: #4a5568;">CREATE ACCOUNT</button>
            </form>
            <div class="btn-secondary" onclick="toggleForm('login')">Back to Login</div>
        </div>

        <p class="mt-8 text-[8px] text-gray-500 uppercase tracking-widest">© 2024 Pokemon Area Battle Team</p>
    </div>

    <div id="notify" class="notification"></div>

    <audio id="bgMusic" src="audio/sound-login.mp3" loop></audio>
    <audio id="clickSound" src="audio/click.mp3"></audio>
    <audio id="successSound" src="audio/transition.mp3"></audio>



</body>
    <script src="script/index.js"></script>
</html>

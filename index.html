<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Area Battle - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body {
    background-color: #1a202c;
    font-family: 'Press Start 2P', cursive;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh; /* Cố định chiều cao bằng đúng màn hình */
    margin: 0;
    overflow: hidden; /* Chặn scroll toàn trang */
}

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2d3748 0%, #1a202c 100%);
            z-index: -1;
        }

.login-card {
    background: rgba(45, 55, 72, 0.95);
    border: 4px solid #ed8936;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
    padding: 1.5rem; /* Giảm padding từ 2.5rem xuống 1.5rem */
    width: 90%; /* Để xinh hơn trên mobile */
    max-width: 400px; /* Giảm chiều rộng tối đa một chút */
    max-height: 95vh; /* Đảm bảo không bao giờ vượt quá chiều cao màn hình */
    overflow-y: auto; /* Nếu màn hình quá nhỏ (như đt nằm ngang), thẻ sẽ tự hiện scrollbar nội bộ */
    text-align: center;
    border-radius: 20px;
    position: relative;
}
/* Thu nhỏ các ô input và nút bấm để tiết kiệm không gian */
.input-field {
    background: #1a202c;
    border: 2px solid #4a5568;
    color: white;
    font-family: 'Arial', sans-serif;
    padding: 10px; /* Giảm từ 12px */
    width: 100%;
    margin-bottom: 0.4rem;
    border-radius: 8px;
    font-size: 14px;
}

        /* ẨN NÚT MẶT ĐỊNH CỦA TRÌNH DUYỆT (CHROME/EDGE) */
        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }
        input::-webkit-contacts-auto-fill-button, 
        input::-webkit-credentials-auto-fill-button {
            visibility: hidden;
            display: none !important;
            pointer-events: none;
            position: absolute;
            right: 0;
        }

        .input-field:focus {
            border-color: #ed8936;
            box-shadow: 0 0 10px rgba(237, 137, 54, 0.3);
        }

        /* Password Wrapper và Nút Ẩn/Hiện */
        .password-container {
            position: relative;
            width: 100%;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-80%); /* Căn giữa theo chiều dọc của ô input */
            cursor: pointer;
            color: #a0aec0;
            font-size: 16px;
            z-index: 20;
            user-select: none;
        }
.btn-primary {
    background: #ed8936;
    color: white;
    padding: 12px; /* Giảm từ 15px */
    width: 100%;
    font-size: 0.65rem; /* Thu nhỏ font chữ pixel */
    border-radius: 8px;
    margin-top: 0.8rem;
}

        .btn-primary:hover {
            background: #f6ad55;
            transform: translateY(-2px);
        }

        .btn-secondary {
            color: #ed8936;
            background: transparent;
            font-size: 0.6rem;
            margin-top: 1.5rem;
            cursor: pointer;
            text-decoration: underline;
            display: inline-block;
        }

        .strength-meter {
            height: 6px;
            width: 100%;
            background-color: #2d3748;
            border-radius: 3px;
            margin-top: 5px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .strength-label {
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            text-align: left;
            margin-top: 2px;
            font-weight: bold;
        }
/* Thu nhỏ ghi chú yêu cầu mật khẩu */
.info-note {
    font-family: 'Arial', sans-serif;
    font-size: 12px; /* Tăng lại một chút để dễ đọc */
    color: #ffd700; /* Màu vàng giống text game */
    background: #2d3748;
    padding: 12px;
    border: 2px solid #4a5568; /* Tạo viền hộp thoại */
    border-radius: 4px; /* Bo góc nhẹ kiểu retro */
    text-align: left;
    margin-top: 12px;
    line-height: 1.5;
    position: relative;
    box-shadow: inset 2px 2px 0px rgba(255,255,255,0.1);
}

.info-note strong {
    color: #ed8936;
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    text-transform: uppercase;
}

/* Hiệu ứng chấm tròn nhỏ ở góc giống hộp thoại Pokemon */
.info-note::after {
    content: "▼";
    position: absolute;
    bottom: 5px;
    right: 8px;
    font-size: 10px;
    color: #ed8936;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            display: none;
            z-index: 100;
            animation: slideIn 0.5s ease-out;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .success { background: #48bb78; color: white; }
        .error { background: #f56565; color: white; }

        .form-container { display: none; }
        .form-active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body onclick="initAudio()">

    <div class="bg-overlay"></div>

    <div class="login-card">
        <h1 class="text-xl mb-2 text-yellow-400" style="text-shadow: 2px 2px #3b4cca;">POKÉMON</h1>
        <h2 class="text-lg mb-8 text-white">AREA BATTLE</h2>
        
        <div id="loginSection" class="form-container form-active">
            <form id="loginForm">
                <div class="text-left mb-2 text-[10px] text-gray-400 uppercase tracking-tighter">Account ID:</div>
                <input type="text" id="loginUser" class="input-field" placeholder="Enter account..." required>

                <div class="text-left mb-2 text-[10px] text-gray-400 uppercase tracking-tighter">Password:</div>
                <div class="password-container">
                    <input type="password" id="loginPass" class="input-field" placeholder="••••••••" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('loginPass')">👁️</span>
                </div>

                <button type="submit" class="btn-primary">START BATTLE!</button>
            </form>
            <div class="btn-secondary" onclick="toggleForm('register')">New Trainer? Register here</div>
        </div>

        <div id="registerSection" class="form-container">
            <form id="registerForm">
                <div class="text-left mb-1 text-[10px] text-gray-400 uppercase tracking-tighter">Trainer Name:</div>
                <input type="text" id="regTrainerName" class="input-field" placeholder="Display name in game" required>

                <div class="text-left mb-1 text-[10px] text-gray-400 uppercase tracking-tighter">Account ID:</div>
                <input type="text" id="regUser" class="input-field" placeholder="Alphanumeric (e.g. Ash123)" required>
                
                <div class="text-left mt-2 mb-1 text-[10px] text-gray-400 uppercase tracking-tighter">New Password:</div>
                <div class="password-container">
                    <input type="password" id="regPass" class="input-field" placeholder="••••••••" required oninput="checkStrength(this.value)">
                    <span class="toggle-password" onclick="togglePasswordVisibility('regPass')">👁️</span>
                </div>
                
                <div class="strength-meter">
                    <div id="strengthBar" class="strength-bar"></div>
                </div>
                <div id="strengthLabel" class="strength-label" style="color: #4a5568;">Strength: -</div>

                <div class="info-note">
                    <strong>Security Tips:</strong>
                    • Min 6 chars (A-z, 0-9, !@#)
                </div>

                <div class="text-left mt-4 mb-1 text-[10px] text-gray-400 uppercase tracking-tighter">Confirm Password:</div>
                <div class="password-container">
                    <input type="password" id="regPassConfirm" class="input-field" placeholder="••••••••" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('regPassConfirm')">👁️</span>
                </div>

                <button type="submit" class="btn-primary" style="background: #4a5568;">CREATE ACCOUNT</button>
            </form>
            <div class="btn-secondary" onclick="toggleForm('login')">Back to Login</div>
        </div>

        <p class="mt-8 text-[8px] text-gray-500 uppercase tracking-widest">© 2024 Pokemon Area Battle Team</p>
    </div>

    <div id="notify" class="notification"></div>

    <audio id="bgMusic" src="audio/sound-login.mp3" loop></audio>
    <audio id="clickSound" src="audio/click.mp3"></audio>
    <audio id="successSound" src="audio/transition.mp3"></audio>

    <script>
        const notify = document.getElementById('notify');
        const clickSound = document.getElementById('clickSound');
        const successSound = document.getElementById('successSound');
        const bgMusic = document.getElementById('bgMusic');
        let audioInitialized = false;

        function initAudio() {
            if (!audioInitialized) {
                bgMusic.volume = 0.5;
                bgMusic.play().catch(e => console.log("Audio play blocked"));
                audioInitialized = true;
            }
        }

        function showNotification(message, type) {
            notify.textContent = message;
            notify.className = `notification ${type}`;
            notify.style.display = 'block';
            setTimeout(() => { notify.style.display = 'none'; }, 4000);
        }

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.currentTarget; // Sử dụng currentTarget để chính xác hơn
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "🔒";
            } else {
                input.type = "password";
                icon.textContent = "👁️";
            }
            if(clickSound) clickSound.play().catch(()=>{});
        }

        function checkStrength(password) {
            const bar = document.getElementById('strengthBar');
            const label = document.getElementById('strengthLabel');
            let strength = 0;

            if (password.length >= 6) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            if (password.length === 0) {
                bar.style.width = "0%";
                label.textContent = "Strength: -";
                label.style.color = "#4a5568";
            } else if (strength <= 1) {
                bar.style.width = "33%";
                bar.style.backgroundColor = "#f56565";
                label.textContent = "Strength: Weak";
                label.style.color = "#f56565";
            } else if (strength === 2 || strength === 3) {
                bar.style.width = "66%";
                bar.style.backgroundColor = "#ed8936";
                label.textContent = "Strength: Medium";
                label.style.color = "#ed8936";
            } else {
                bar.style.width = "100%";
                bar.style.backgroundColor = "#48bb78";
                label.textContent = "Strength: Strong";
                label.style.color = "#48bb78";
            }
        }

        function toggleForm(type) {
            if(clickSound) clickSound.play().catch(()=>{});
            
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
            
            document.querySelectorAll('.password-container input').forEach(i => i.type = "password");
            document.querySelectorAll('.toggle-password').forEach(s => s.textContent = "👁️");

            document.getElementById('strengthBar').style.width = "0%";
            document.getElementById('strengthLabel').textContent = "Strength: -";

            document.getElementById('loginSection').classList.toggle('form-active', type === 'login');
            document.getElementById('registerSection').classList.toggle('form-active', type === 'register');
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const trainerName = document.getElementById('regTrainerName').value.trim();
            const account = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;
            const confirm = document.getElementById('regPassConfirm').value;

            if (trainerName.length < 2) { showNotification("Trainer Name must be at least 2 characters!", "error"); return; }
            if (!/^[a-zA-Z0-9]+$/.test(account)) { showNotification("Account ID cannot contain accents, spaces, or symbols!", "error"); return; }
            if (account.length < 3) { showNotification("Account ID must be at least 3 characters!", "error"); return; }
            if (pass.length < 6) { showNotification("Password must be at least 6 characters!", "error"); return; }
            if (pass !== confirm) { showNotification("Passwords do not match!", "error"); return; }

            const users = JSON.parse(localStorage.getItem('pokemon_users') || '{}');
            
            if (users[account]) {
                showNotification("Account ID already exists!", "error");
            } else {
                users[account] = { password: pass, trainerName: trainerName };
                localStorage.setItem('pokemon_users', JSON.stringify(users));
                showNotification("Registration successful!", "success");
                document.getElementById('registerForm').reset();
                toggleForm('login');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(clickSound) clickSound.play().catch(()=>{});

            const account = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;

            const users = JSON.parse(localStorage.getItem('pokemon_users') || '{"admin":{"password":"123456","trainerName":"Admin"}}');

            const userData = users[account];
            if (userData) {
                const storedPass = (typeof userData === 'object') ? userData.password : userData;
                const trainerName = (typeof userData === 'object') ? userData.trainerName : account;

                if (storedPass === pass) {
                    showNotification("Login successful!", "success");
                    if(successSound) successSound.play().catch(()=>{});
                    sessionStorage.setItem('trainerName', trainerName);
                    localStorage.setItem('last_logged_in', JSON.stringify({account: account, password: pass}));
                    setTimeout(() => { window.location.assign("game.html"); }, 1500);
                } else {
                    showNotification("Invalid password!", "error");
                    document.getElementById('loginPass').value = "";
                }
            } else {
                showNotification("Account does not exist!", "error");
            }
        });

        window.addEventListener('load', function() {
            const saved = localStorage.getItem('last_logged_in');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('loginUser').value = data.account;
                document.getElementById('loginPass').value = data.password;
            }
        });
    </script>
</body>
</html>
